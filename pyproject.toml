[project]
name = "angarion"
version = "0.1.0"
description = "Универсальный движок мультиформатных конвейеров данных: любой источник → обработка → любой приёмник (hexagonal, ports & adapters)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Vladimir Kirievskiy", email = "vlakir1234@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
]
keywords = ["messaging", "pipeline", "events", "telegram", "hexagonal-architecture"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

# Контрактные наборы тестов портов для авторов сторонних адаптеров
# (§12.11, FR-9 спеки T003); pytest11-плагин — assert-rewriting (A-2).
[project.optional-dependencies]
testing = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]
persistqueue = [
    "persist-queue>=1.0",
]
# SQLAlchemy/SQLite-хранилище + Alembic-миграции (§12.3, §14.9;
# FR-3 спеки T003); greenlet — транзитивно от sqlalchemy[asyncio] (A-9).
sqlite = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "sqlalchemy[asyncio]>=2.0.41",
]
# Telegram-адаптер (M3, T005): Telethon (MTProto) + Fernet-шифрование
# StringSession at-rest (Q2 спеки T005). Регистрируется entry point'ом
# angarion.adapters:telegram (собирается в фазе 5 — composition root).
telegram = [
    "telethon>=1.43.2",
    "cryptography>=43",
    "tenacity>=9",
]
# Matrix-адаптер (M7 часть B, T010): matrix-nio (async-клиент Matrix) +
# Fernet-шифрование сессии at-rest (как Telegram). E2EE (olm/megolm) с фазы
# B2 — nio[e2e] тянет python-olm, которому нужна системная libolm (на Debian/
# Ubuntu: `apt install libolm-dev`; см. README). Регистрируется entry
# point'ом angarion.adapters:matrix.
matrix = [
    "matrix-nio[e2e]>=0.25",
    "cryptography>=43",
]
# LLM-процессор (M4, T007): OpenAI-совместимый HTTP-вызов (httpx,
# типизирован под mypy --strict) + tenacity-ретраи на сети/5xx/429
# (Q6). Процессор llm живёт в отдельном модуле и регистрируется entry
# point'ом angarion.processors:llm (фаза 3). jinja2 для промптов — в
# core (template — встроенный v1, всегда доступен).
llm = [
    "httpx>=0.27",
    "tenacity>=9",
]
# Web-слой M5: FastAPI как второй driving-адаптер (§12.5/§12.6, T022) +
# аутентификация на fastapi-users (§12.7, T023). FastAPI тянет
# starlette/pydantic; fastapi-users[sqlalchemy] — fastapi-users-db-
# sqlalchemy (user store на нашем SQLAlchemy 2.0), pwdlib[argon2] (хэш
# паролей), pyjwt (JWT-транспорт), python-multipart (формы логина).
# uvicorn — ASGI-раннер ролей процессов (`run --with-api` / `--role api`,
# §12.9, T024); сами ASGI-тесты идут через httpx.ASGITransport. Ядро
# остаётся fastapi-free (§14.9): FastAPI/uvicorn тянет только http-адаптер.
web = [
    "fastapi>=0.115",
    "fastapi-users[sqlalchemy]>=15",
    "uvicorn>=0.30",
]

[project.scripts]
angarion = "angarion.cli:main"

[project.entry-points.pytest11]
angarion_testing = "angarion._testing_plugin"

# InMemory-плагин — «нулевой пациент» механизма расширения (§12.11, FR-14):
# библиотека регистрирует его теми же entry points, что и сторонние пакеты.
[project.entry-points."angarion.adapters"]
memory = "angarion.adapters.memory.plugin:PLUGIN"
telegram = "angarion.adapters.telegram.plugin:PLUGIN"
matrix = "angarion.adapters.matrix.plugin:PLUGIN"

[project.entry-points."angarion.queues"]
memory = "angarion.adapters.memory.plugin:QUEUE_BACKEND"
persistqueue = "angarion.adapters.queue.persistqueue_:QUEUE_BACKEND"

[project.entry-points."angarion.storages"]
memory = "angarion.adapters.memory.plugin:STORAGE_BACKEND"
sqlite = "angarion.adapters.storage.plugin:STORAGE_BACKEND"

[project.entry-points."angarion.processors"]
passthrough = "angarion.application.processors:PASSTHROUGH"
template = "angarion.application.processors:TEMPLATE"
# llm — под extra angarion[llm] (httpx+tenacity); без extra load_processors
# пропускает его (ModuleNotFoundError → skip+warning), как у адаптеров.
llm = "angarion.application.llm:LLM"

[project.urls]
Homepage = "https://github.com/vlakir/angarion"
Repository = "https://github.com/vlakir/angarion"
Issues = "https://github.com/vlakir/angarion/issues"
Changelog = "https://github.com/vlakir/angarion/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angarion"]
[dependency-groups]
dev = [
    "ruff>=0.12.10",
    "mypy>=1.17.1",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
    "telethon>=1.43.2",
    "cryptography>=43",
    "tenacity>=9",
    "httpx>=0.27",
    "persist-queue>=1.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16",
    "aiosqlite>=0.21",
    "fastapi>=0.115",
    "fastapi-users[sqlalchemy]>=15",
    "uvicorn>=0.30",
    "matrix-nio[e2e]>=0.25",
    "twine>=6.2.0",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]


[tool.ruff]
unsafe-fixes = true
line-length = 88
indent-width = 4
target-version = "py312"
# Каталоги примеров — намеренно НЕ пакеты (одиночные скрипты processor.py /
# run.py / ext.py без __init__.py): подавляет ложный INP001 на них, не трогая
# остальное.
namespace-packages = ["examples/digest", "examples/media", "examples/web"]
exclude = [
    "**/migrations",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "build",
    "dist",
    "tests",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1", "D203", "D212",
    "BLE001", "ANN002", "ANN204",
    "RUF001", "COM812", "RUF002",
    "RUF003", "G004", "PLR0912",
    "PLR0913", "D401", "PLR0915",
    "C901", "D205", "N802",
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.per-file-ignores]
# Контрактные тесты angarion.testing — публичный пакет в src (FR-9
# спеки T003): assert — идиома pytest, замена на raise ломает
# репортинг. Согласовано с Разработчиком 2026-06-12 (A-1 спеки T003).
"src/angarion/testing/**" = ["S101"]


[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
mypy_path = "src"
exclude = ["/migrations/"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=90 -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: тесты на реальном Telegram-аккаунте (реквизиты в .secrets; запуск: pytest -m integration)",
]


[tool.coverage.run]
source = ["src"]
branch = true
# SQLAlchemy async выполняет операции БД в greenlet'е; без этого coverage
# теряет трассировку строк, исполняемых после await к БД (ложные пропуски
# в async-ручках web-слоя). Требует пакет greenlet (есть от sqlalchemy[asyncio]).
concurrency = ["thread", "greenlet"]
omit = ["*/migrations/*"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
