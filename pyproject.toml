[project]
name = "angarion"
version = "0.1.0"
description = "Универсальная библиотека конвейеров обработки событий сообщений (hexagonal, ports & adapters)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Vladimir Kirievskiy", email = "vlakir1234@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
]
keywords = ["messaging", "pipeline", "events", "telegram", "hexagonal-architecture"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

# Контрактные наборы тестов портов для авторов сторонних адаптеров
# (§12.11, FR-9 спеки T003); pytest11-плагин — assert-rewriting (A-2).
[project.optional-dependencies]
testing = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]
persistqueue = [
    "persist-queue>=1.0",
]
# SQLAlchemy/SQLite-хранилище + Alembic-миграции (§12.3, §14.9;
# FR-3 спеки T003); greenlet — транзитивно от sqlalchemy[asyncio] (A-9).
sqlite = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "sqlalchemy[asyncio]>=2.0.41",
]

[project.entry-points.pytest11]
angarion_testing = "angarion._testing_plugin"

# InMemory-плагин — «нулевой пациент» механизма расширения (§12.11, FR-14):
# библиотека регистрирует его теми же entry points, что и сторонние пакеты.
[project.entry-points."angarion.adapters"]
memory = "angarion.adapters.memory.plugin:PLUGIN"

[project.entry-points."angarion.queues"]
memory = "angarion.adapters.memory.plugin:QUEUE_BACKEND"
persistqueue = "angarion.adapters.queue.persistqueue_:QUEUE_BACKEND"

[project.entry-points."angarion.storages"]
memory = "angarion.adapters.memory.plugin:STORAGE_BACKEND"
sqlite = "angarion.adapters.storage.plugin:STORAGE_BACKEND"

[project.entry-points."angarion.processors"]
passthrough = "angarion.application.processors:PASSTHROUGH"

[project.urls]
Homepage = "https://github.com/vlakir/angarion"
Repository = "https://github.com/vlakir/angarion"
Issues = "https://github.com/vlakir/angarion/issues"
Changelog = "https://github.com/vlakir/angarion/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angarion"]
[dependency-groups]
dev = [
    "ruff>=0.12.10",
    "mypy>=1.17.1",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
    "telethon>=1.43.2",
    "persist-queue>=1.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16",
    "aiosqlite>=0.21",
]


[tool.ruff]
unsafe-fixes = true
line-length = 88
indent-width = 4
target-version = "py312"
exclude = [
    "**/migrations",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "build",
    "dist",
    "tests",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1", "D203", "D212",
    "BLE001", "ANN002", "ANN204",
    "RUF001", "COM812", "RUF002",
    "RUF003", "G004", "PLR0912",
    "PLR0913", "D401", "PLR0915",
    "C901", "D205", "N802",
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.per-file-ignores]
# Контрактные тесты angarion.testing — публичный пакет в src (FR-9
# спеки T003): assert — идиома pytest, замена на raise ломает
# репортинг. Согласовано с Разработчиком 2026-06-12 (A-1 спеки T003).
"src/angarion/testing/**" = ["S101"]


[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
mypy_path = "src"
exclude = ["/migrations/"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=90 -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: тесты на реальном Telegram-аккаунте (реквизиты в .secrets; запуск: pytest -m integration)",
]


[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/migrations/*"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
