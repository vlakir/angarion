# Пример angarion: цепочка пайплайнов через «внутренний провод» (T037).
#
# Два независимых пайплайна, связанных НАПРЯМУЮ, без служебной группы-
# посредника в Telegram:
#
#   группа A ──(stage1: нормализатор)──▶ internal:stage1 ──(stage2: оформитель)──▶ группа B
#
# Выход первого пайплайна (target на транспорте `internal`) становится
# входом второго (source на том же внутреннем канале) — re-ingestion минует
# реальную платформу: ни лишнего трафика, ни видимого служебного чата.
# Та же связка раньше требовала отдельную группу-посредник X.
#
# Скопируй и подставь свои значения. Секреты (api_id/api_hash, ключ
# шифрования сессии) — НЕ здесь, а через переменные окружения (см.
# README.md). В TOML — только не-секретные параметры.

[accounts.main]
transport = "telegram"
# api_id / api_hash подаются через env:
#   ANGARION_ACCOUNTS__MAIN__API_ID, ANGARION_ACCOUNTS__MAIN__API_HASH

# Внутренний транспорт: синтетический, без выхода наружу и без секретов.
# Его «аккаунт» нужен лишь чтобы объявить транспорт; канал (адрес) —
# произвольное имя, по которому стыкуются пайплайны (см. ниже `stage1`).
[accounts.wire]
transport = "internal"

[storage]
backend = "sqlite"               # обязателен: сюда login кладёт сессию
path = "angarion-data/app.db"    # рантайм-каталог (git-ignored)

[queue]
backend = "memory"               # для примера; боевой — persistqueue

# Параметры внутреннего провода. max_hops — рантайм-лимит прыжков записи
# по внутренним рёбрам (backstop против циклов, которые стартовая
# DAG-проверка не видит — напр. цикл через реальную группу). Дефолт 10.
[chains]
max_hops = 10

# --- Звено 1: нормализатор -------------------------------------------------
# Слушает группу A, приводит сообщение к единому виду (здесь — снимает
# лишнее и добавляет служебную пометку) и кладёт результат во внутренний
# канал `stage1`. Наружу ничего не отправляет.
[pipelines.stage1]
processor = "template"
events = ["new"]
sources = [{ account = "main", address = "-100AAAAAAAAAA" }]
targets = [{ account = "wire", address = "stage1" }]

[pipelines.stage1.processor_config]
template = "[norm] {{ text }}"

# --- Звено 2: оформитель ---------------------------------------------------
# Слушает внутренний канал `stage1` (выход звена 1), оформляет итоговое
# сообщение и доставляет в группу B на реальном Telegram-аккаунте.
# `{{ origin }}` здесь — `internal`: маркер, что запись пришла по проводу,
# а не напрямую с платформы (сквозная трассировка, origin рядом с
# live/catchup).
[pipelines.stage2]
processor = "template"
events = ["new"]
sources = [{ account = "wire", address = "stage1" }]
targets = [{ account = "main", address = "-100BBBBBBBBBB" }]

[pipelines.stage2.processor_config]
template = "✅ обработано ({{ origin }})\n{{ text }}"
