{% extends "angarion/base.html" %}
{% block title %}angarion — users{% endblock %}
{% block content %}
<hgroup>
  <h2>Users</h2>
  <p>Approve requests, roles and access.</p>
</hgroup>

<article>
  <h3>Create user</h3>
  <form hx-post="/ui/users/create" hx-target="#users-table">
    <div class="grid">
      <input type="text" name="login" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <select name="role">
        {% for role in roles %}
        <option value="{{ role }}">{{ role }}</option>
        {% endfor %}
      </select>
      <button type="submit">Create</button>
    </div>
  </form>
</article>

<article id="users-table">
  {% include "angarion/fragments/users_table.html" %}
</article>
{% endblock %}
