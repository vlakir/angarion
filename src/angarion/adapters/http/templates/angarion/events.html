{% extends "angarion/base.html" %}
{% block title %}angarion — events{% endblock %}
{% block content %}
<hgroup>
  <h2>Журнал событий</h2>
  <p>Аналитика с фильтрами по виду и пайплайну.</p>
</hgroup>

<form hx-get="/ui/fragments/events-table" hx-target="#events-table" hx-trigger="submit">
  <div class="grid">
    <input type="search" name="kind" placeholder="вид (kind)" value="{{ kind }}">
    <input type="search" name="pipeline" placeholder="пайплайн" value="{{ pipeline }}">
    <button type="submit">Фильтр</button>
  </div>
</form>

<div id="events-table">
  {% include "angarion/fragments/events_table.html" %}
</div>
{% endblock %}
