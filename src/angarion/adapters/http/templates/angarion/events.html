{% extends "angarion/base.html" %}
{% block title %}angarion — events{% endblock %}
{% block content %}
<hgroup>
  <h2>Event log</h2>
  <p>Analytics, filterable by kind and pipeline.</p>
</hgroup>

<form hx-get="/ui/fragments/events-table" hx-target="#events-table" hx-trigger="submit">
  <div class="grid">
    <input type="search" name="kind" placeholder="kind" value="{{ kind }}">
    <input type="search" name="pipeline" placeholder="pipeline" value="{{ pipeline }}">
    <button type="submit">Filter</button>
  </div>
</form>

<div id="events-table">
  {% include "angarion/fragments/events_table.html" %}
</div>
{% endblock %}
