<table>
  <thead>
    <tr><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.login }}</td>
      <td>{{ user.role }}</td>
      <td>{{ 'active' if user.is_active else 'pending' }}</td>
      <td>
        {% if not user.is_active %}
        <form hx-post="/ui/users/{{ user.id }}/approve" hx-target="#users-table">
          <select name="role">
            {% for role in roles %}
            <option value="{{ role }}">{{ role }}</option>
            {% endfor %}
          </select>
          <button type="submit">Approve</button>
        </form>
        {% else %}
        <button hx-post="/ui/users/{{ user.id }}/deactivate" hx-target="#users-table">
          Deactivate
        </button>
        {% endif %}
        <button hx-post="/ui/users/{{ user.id }}/delete" hx-target="#users-table"
                hx-confirm="Delete {{ user.login }}?">
          Delete
        </button>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4"><em>no users</em></td></tr>
    {% endfor %}
  </tbody>
</table>
