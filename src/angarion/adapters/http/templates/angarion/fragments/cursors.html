<h3>Курсоры источников</h3>
<table>
  <thead><tr><th>Источник</th><th>Обновлён</th></tr></thead>
  <tbody>
    {% for row in cursors %}
    <tr>
      <td>{{ row.source_key }}</td>
      <td>{{ row.updated_at.isoformat() if row.updated_at else '—' }}</td>
    </tr>
    {% else %}
    <tr><td colspan="2"><em>источников нет</em></td></tr>
    {% endfor %}
  </tbody>
</table>
