<h3>Source cursors</h3>
<table>
  <thead><tr><th>Source</th><th>Updated</th></tr></thead>
  <tbody>
    {% for row in cursors %}
    <tr>
      <td>{{ row.source_key }}</td>
      <td>{{ row.updated_at.isoformat() if row.updated_at else '—' }}</td>
    </tr>
    {% else %}
    <tr><td colspan="2"><em>no sources</em></td></tr>
    {% endfor %}
  </tbody>
</table>
