<h3>Events (last 24h)</h3>
<table>
  <thead><tr><th>Kind</th><th>Count</th></tr></thead>
  <tbody>
    {% for kind, count in counts.items() %}
    <tr><td>{{ kind }}</td><td>{{ count }}</td></tr>
    {% else %}
    <tr><td colspan="2"><em>no events</em></td></tr>
    {% endfor %}
  </tbody>
</table>
